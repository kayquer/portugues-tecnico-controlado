<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="pipeline bilíngue do PTC: o texto original entra e é reescrito na própria língua fonte, que vira a verdade; o texto já controlado é então traduzido, e as regras da língua alvo só se aplicam onde não alterem a proposição; quando uma regra do português exige informação que a fonte não tinha, uma aresta de retorno chamada linter reverso volta à fonte e corrige o inglês em vez da tradução; embaixo, dois caminhos proibidos: round-trip PT para EN para PT, e normalizar os dois idiomas em paralelo a partir do original bruto">
  <style>
    .box  { stroke: #8b949e; fill: none; stroke-width: 1.4; }
    .ln   { stroke: #8b949e; fill: none; stroke-width: 1.4; }
    .dash { stroke: #8b949e; fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tx   { fill: #57606a; }
    .dim  { fill: #8b949e; }
    .no   { fill: #cf222e; }
    .nostroke { stroke: #cf222e; fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .box, .ln { stroke: #7d8590; }
      .dash { stroke: #768390; }
      .tx  { fill: #adbac7; }
      .dim { fill: #768390; }
      .no  { fill: #f85149; }
      .nostroke { stroke: #f85149; }
    }
  </style>
  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" class="ln"/>
    </marker>
    <marker id="setavolta" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" class="dash" stroke-dasharray="0"/>
    </marker>
  </defs>

  <!-- 1. texto original -->
  <rect class="box" x="20" y="34" width="152" height="74" rx="6"/>
  <text class="tx"  x="96" y="63" text-anchor="middle" font-size="13">texto original</text>
  <text class="dim" x="96" y="82" text-anchor="middle" font-size="9">EN ou PT — o idioma</text>
  <text class="dim" x="96" y="94" text-anchor="middle" font-size="9">do input é a fonte</text>

  <line class="ln" x1="172" y1="71" x2="294" y2="71" marker-end="url(#seta)"/>
  <text class="dim" x="233" y="58" text-anchor="middle" font-size="10">passo 1</text>

  <!-- 2. fonte controlada -->
  <rect class="box" x="298" y="26" width="214" height="90" rx="6"/>
  <text class="tx"  x="405" y="58" text-anchor="middle" font-size="13">fonte controlada</text>
  <text class="dim" x="405" y="78" text-anchor="middle" font-size="9">reescrita sob as regras da</text>
  <text class="dim" x="405" y="90" text-anchor="middle" font-size="9">própria língua — STE ou PTC</text>
  <text class="dim" x="405" y="106" text-anchor="middle" font-size="9">este texto vira a verdade</text>

  <line class="ln" x1="512" y1="71" x2="646" y2="71" marker-end="url(#seta)"/>
  <text class="dim" x="579" y="42" text-anchor="middle" font-size="10">passo 2</text>
  <text class="dim" x="579" y="56" text-anchor="middle" font-size="9">traduz o já controlado,</text>
  <text class="dim" x="579" y="92" text-anchor="middle" font-size="9">nunca o original bruto</text>

  <!-- 3. alvo derivado -->
  <rect class="box" x="650" y="34" width="190" height="74" rx="6"/>
  <text class="tx"  x="745" y="63" text-anchor="middle" font-size="13">alvo derivado</text>
  <text class="dim" x="745" y="82" text-anchor="middle" font-size="9">passo 3: regras do alvo só</text>
  <text class="dim" x="745" y="94" text-anchor="middle" font-size="9">onde não mudam a proposição</text>

  <!-- linter reverso: aresta de retorno -->
  <path class="dash" d="M745,108 V166 H405 V120" marker-end="url(#setavolta)"/>
  <text class="tx"  x="575" y="186" text-anchor="middle" font-size="11">linter reverso</text>
  <text class="dim" x="575" y="202" text-anchor="middle" font-size="9">regra do alvo pede informação que a fonte não tinha</text>
  <text class="dim" x="575" y="214" text-anchor="middle" font-size="9">— corrige a fonte, não a tradução</text>

  <!-- o que nunca acontece -->
  <line class="dash" x1="20" y1="238" x2="840" y2="238"/>
  <text class="no"  x="20" y="260" font-size="11">nunca</text>
  <rect class="nostroke" x="70" y="248" width="168" height="18" rx="4"/>
  <text class="no"  x="154" y="261" text-anchor="middle" font-size="10">PT → EN → PT</text>
  <text class="dim" x="250" y="261" font-size="9">cada tradução reintroduz a ambiguidade que o controle acabou de remover</text>
  <rect class="nostroke" x="70" y="272" width="168" height="18" rx="4"/>
  <text class="no"  x="154" y="285" text-anchor="middle" font-size="10">os dois em paralelo</text>
  <text class="dim" x="250" y="285" font-size="9">normalizar do original bruto: cada regra puxa para um lado e as versões divergem</text>
</svg>
